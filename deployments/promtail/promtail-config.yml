# Promtail auto-discovers ALL containers' stdout/stderr logs via the
# Docker socket and ships them to Loki — there's no need to define log
# routing separately for each service (the 12-factor app principle: the
# application just writes JSON to stdout, and the infrastructure handles
# collection).
server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      - source_labels: ["__meta_docker_container_name"]
        regex: "/(.*)"
        target_label: "container"
      - source_labels: ["__meta_docker_container_log_stream"]
        target_label: "stream"