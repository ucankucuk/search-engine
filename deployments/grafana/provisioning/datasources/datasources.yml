# Grafana reads this file on startup and automatically adds Prometheus
# and Loki as data sources — no need to click "Add data source" manually.
apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true

  - name: Loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: true